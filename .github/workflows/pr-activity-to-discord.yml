name: PR activity to Discord (build-jobs)

# Forwards pull-request comments and review summaries (Codex reviews, CI
# feedback, human comments) to the #build-jobs Discord channel via a webhook.
#
# Note: comment/review event workflows always run the file as it exists on the
# repository DEFAULT branch (main), so this only takes effect once merged to
# main. Set the DISCORD_BUILD_JOBS_WEBHOOK repository secret to the channel's
# webhook URL; without it the job is a no-op.

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  forward:
    runs-on: ubuntu-latest
    # issue_comment also fires for plain issues; only forward pull-request activity.
    if: ${{ github.event_name != 'issue_comment' || github.event.issue.pull_request }}
    steps:
      - uses: actions/github-script@v7
        env:
          WEBHOOK: ${{ secrets.DISCORD_BUILD_JOBS_WEBHOOK }}
        with:
          script: |
            const webhook = process.env.WEBHOOK;
            if (!webhook) {
              core.warning('DISCORD_BUILD_JOBS_WEBHOOK not set; skipping.');
              return;
            }
            const e = context.eventName;
            const p = context.payload;
            let pr, title, author, body, url, kind;
            if (e === 'issue_comment') {
              pr = p.issue.number; title = p.issue.title;
              author = p.comment.user.login; body = p.comment.body || '';
              url = p.comment.html_url; kind = 'comment';
            } else if (e === 'pull_request_review') {
              pr = p.pull_request.number; title = p.pull_request.title;
              author = p.review.user.login;
              body = p.review.body || `(no summary, state: ${p.review.state})`;
              url = p.review.html_url; kind = `review: ${p.review.state}`;
            } else {
              pr = p.pull_request.number; title = p.pull_request.title;
              author = p.comment.user.login;
              body = '`' + p.comment.path + '`\n' + (p.comment.body || '');
              url = p.comment.html_url; kind = 'inline comment';
            }
            const header = `**PR #${pr}** ${title}\n*${kind} by ${author}* <${url}>\n`;
            const room = 1900 - header.length;
            const trimmed = body.length > room ? body.slice(0, room) + '\n...(truncated)' : body;
            // flags=4 (SUPPRESS_EMBEDS) keeps the message tidy, no link previews.
            // allowed_mentions parse:[] neutralizes @everyone/@here/role/user
            // mentions injected into untrusted PR comment text.
            const res = await fetch(webhook, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                content: header + trimmed,
                flags: 4,
                allowed_mentions: { parse: [] },
              }),
            });
            if (!res.ok) {
              core.setFailed(`Discord POST failed: ${res.status} ${await res.text()}`);
            }
