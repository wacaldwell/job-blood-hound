# Hard voice rules the generator must follow.
voice:
  - Plain English. No jargon for its own sake.
  - Never use em dashes or double hyphens. Use commas, parentheses, or separate sentences.
  - Accuracy over keyword stuffing. Emphasize what is true and relevant; never fabricate.
  - Never derive or compute a number that is not written in this file. Do not infer years of experience, tenure, or team counts from dates. Use only figures stated here, verbatim.
  - Every role here has ended, including the most recent one. Write all experience bullets in past tense, and never imply current employment.
  - For management or leadership roles, keep the years of team leadership from the summary. It is a core qualification, not filler, so do not trim it when tightening.
  - Select at most 6 bullets per role, and fewer for older roles. This file is the complete superset to choose from, not the output. Pick the bullets most relevant to the target job and drop the rest; a tight 6 beats a diluted 10.
  - Each bullet must be distinct. Never repeat the same metric or a near-duplicate accomplishment across bullets; if two bullets say the same thing, keep the stronger one and drop the other.
  - Prefer a few credible, specific numbers over many round ones. Do not attach a percentage to every bullet.

# --- Fit Gate ledger ------------------------------------------------------
# Read by gate.py. capabilities are what the candidate can defend with
# evidence; do_not_claim are the hard disqualifiers that overrule the model
# outright. A claim with no evidence is not a capability and the loader
# rejects it, so never leave `evidence` blank to "fill in later".

capabilities:
  - claim: multi-account AWS governance and cloud operations
    evidence: Northwind Commerce, AWS Organization of 10 accounts, over $1M/year spend, Dec 2022 to Jul 2024
  - claim: AWS security tooling (Security Hub, IAM, Identity Center)
    evidence: Northwind Commerce, owned Security Hub, IAM and Identity Center, Dec 2022 to Jul 2024
  - claim: infrastructure as code with Terraform
    evidence: Northwind Commerce, designed and maintained Terraform IaC frameworks; Helio Payments DevOps, Terraform/Puppet/Jenkins
  - claim: compliance programs (SOC 2, ISO 27001, PCI DSS)
    evidence: Northwind Commerce, drove SOC 2 and ISO 27001 to completion; Helio Payments, owned PCI DSS for the payment platform
  - claim: incident management and root cause analysis at scale
    evidence: Helio Payments Manager II Site Operations, led RCA on recurring outages, 2017 to 2022
  - claim: observability tooling (Grafana, Splunk, Nagios)
    # Datadog deliberately NOT claimed here (operator ruling, 2026-08-19):
    # familiarity only, so it stays in the skills list and is never evidence
    # for a capability. This is the pattern for anything you have touched but
    # could not defend in an interview.
    evidence: Trellis Networks, built a Nagios system monitoring 1,400 video feeds across a global CDN; Helio Payments DevOps, built monitoring, alerting and runbooks that met uptime and SLA targets; Helio Payments, PCI DSS reporting via Splunk
  - claim: leading engineering teams
    evidence: Helio Payments, led a team of 4; Northwind Commerce, managed a team of 3
  - claim: AI-accelerated DevOps tooling and agent rules
    evidence: Northwind Commerce, built an incident-triage assistant, standardized multi-model AI tooling, authored global and repo-specific agent rules
  - claim: Docker containerization
    evidence: Helio Payments DevOps, led operational transformation with Docker containerization, Jul 2013 to May 2017
  - claim: AWS Well-Architected Framework
    evidence: AWS Certified Solutions Architect Associate (June 2024); Northwind Commerce, partnered with AWS TAMs and Solutions Architects on architecture best practices; reviewed the Bedrock rollout for AWS best-practice alignment
  - claim: CI/CD pipelines with GitHub Actions
    evidence: GitHub Actions deploy and PR-validation workflows across personal infrastructure repos; Helio Payments DevOps, CI/CD with Jenkins
  - claim: AWS partnership and cost management
    evidence: Northwind Commerce, partnered with AWS TAMs and Solutions Architects on architecture, service selection and cost
  - claim: CI/CD pipeline ownership (GitHub Actions, Jenkins)
    evidence: Northwind Commerce, built and operated the production CI/CD pipelines in GitHub Actions; Helio Payments DevOps, Jenkins and zero-downtime release coordination

# The gate forces NONE on any requirement matching these, whatever the model
# says. A missing entry here is a silent hole, so add to this list every time a
# real posting teaches you a gap. Each entry needs a `claim` and at least one
# of `match` (lowercase substrings) or `match_word` (whole normalized words).
do_not_claim:
  - claim: hand-writing production code
    # The candidate directs AI tools and judges the output. That is a real
    # skill, and it is not the same skill a live-coding loop tests for.
    # The player-coach tokens were added after one live posting slipped the
    # ledger: it asked for a "hands-on engineering background in Python and at
    # least one other backend language, with the ability to read, review, and
    # contribute to production code" and the model bridged that to PARTIAL off
    # Bash and Terraform scripting, so a role that wants a manager who codes
    # came back RECOMMEND. The operator rated it a weak match by hand.
    match:
      - proficient in python
      - proficient in go
      - python or go
      - write production code
      - writing production code
      - strong programming
      - hands-on coding
      - codes daily
      - contribute to production code
      - contribute code
      - backend language
      - background in python
      - hands-on technical contributions
      - player-coach
  - claim: data catalog architecture
    # Kept narrow on purpose. "data catalog" is the artifact being asked for;
    # widening it to bare "catalog" or "metadata" would force a false NONE on
    # ordinary platform postings.
    match:
      - data catalog
      - data cataloging
  - claim: event correlation
    # On one live run the model rationalized "correlation" into a PARTIAL by
    # citing the incident-triage assistant as "signal correlation work". The
    # ledger forced it back to NONE, which is exactly what the ledger is for:
    # it overrules the model outright and is the only thing that can.
    match:
      - correlation
  - claim: high-throughput streaming platforms built from the ground up
    match:
      - kafka
      - kinesis
      - streaming platform
  - claim: container orchestration platforms (Kubernetes, EKS, ECS)
    # Docker and containerization ARE the candidate's (Helio Payments DevOps
    # 2013 to 2017, and the Containers skill line), so this entry names the
    # ORCHESTRATION PLATFORM and never containers on their own. Widening it to
    # "container" would make the semantic screen force a false NONE on plain
    # Docker requirements too, which is the over-match failure this ledger
    # already hit once on scripting.
    #
    # "ecs" and "eks" go in match_word, not match: they are inside "specs" and
    # "weeks", so a substring token would misfire on ordinary JD wording, while
    # multi-word forms ("amazon ecs", "ecs or eks") miss a requirement written
    # as a bare "ECS". match_word matches whole normalized words and catches
    # both.
    match:
      - kubernetes
      - k8s
      - kubernetes administration
      - container orchestration
      - orchestration platform
    match_word:
      - ecs
      - eks

# How the candidate actually works, for the gate's title check. A title whose
# role-noun is not in this list predicts an interview loop shaped differently
# than the way they work.
works_as:
  - manager
  - architect
  - lead
  - director
