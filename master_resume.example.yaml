  a platform serving roughly 1 billion requests per month, owning security,
  compliance (SOC 2, ISO 27001), and Terraform-based infrastructure as code.
  Has led small engineering teams for over 6 years (4 years 9 months at Helio
  Payments, 19 months at Northwind Commerce) and built practical GenAI tooling
