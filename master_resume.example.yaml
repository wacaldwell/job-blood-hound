# master_resume.example.yaml - worked example of the master resume.
#
# Copy this to master_resume.yaml and replace every value with your own. The
# real file is gitignored on purpose, because it carries your name, contact
# details and full employment history.
#
# Source of truth for tailored applications. The generator SELECTS and
# EMPHASIZES from this; it must not invent anything not grounded here.
# Keep it complete and accurate. Add detail freely; tailoring trims it down.
#
# Everything below describes a fictional candidate, Jordan Rivers, so the
# schema can be read end to end without inventing it from the loaders.
#
# Keys the code reads, and where:
#   contact          job_generate.write_resume_docx / write_cover_letter_docx
#                    (name, location, email, phone), gate.build_evidence
#                    (location only; email and phone are not evidence and are
#                    never put in a prompt)
#   summary          gate.build_evidence, the drafting prompt
#   experience       gate.build_evidence (company, title, start, end, points)
#                    and the resume renderer (location too)
#   certifications   gate.build_evidence, resume renderer
#   skills           gate.build_evidence, resume renderer
#   education        gate.build_evidence, resume renderer (degree, school)
#   voice            the drafting prompt
#   capabilities     gate.load_profile (claim + evidence, both required)
#   do_not_claim     gate.load_profile / gate.enforce / gate.ledger_sweep
#                    (claim + at least one of match / match_word)
#   works_as         gate.title_check

contact:
  name: Jordan Rivers
  title: Cloud Operations Manager
  location: Portland, OR 97205
  email: jordan.rivers@example.com
  phone: (555) 010-4477

summary: >
